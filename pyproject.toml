[project]
name = "drophunter-agent"
version = "4.0.0a3"
description = "Agente DropHunter: roda no PC do cliente, proxy Empire/Steam com chave local e lista branca"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Diogo Hesilva" }]
dependencies = [
    "httpx>=0.27",
    "python-socketio[asyncio_client]>=5.11",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
    "pyinstaller>=6.0",
]

[project.scripts]
drophunter-agent = "drophunter_agent.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["drophunter_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["N818"]  # excecoes com nome em portugues, sem sufixo Error
